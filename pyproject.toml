[project]
name = "hall-of-automata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []
site_name = "Hall of Automata"
site_url = "https://mockasort-studio.github.io/hall-of-automata/"
repo_url = "https://github.com/MockaSort-Studio/hall-of-automata"
site_description = "Federated AI agent orchestration for GitHub organisations — built on Claude Code and GitHub Actions."
site_author = "MockaSort Studio"
docs_dir = "codex"
extra_css = ["stylesheets/extra.css"]
nav = [
    {"Home" = "index.md"},
    {"Design" = [
        {"System Specification" = "design_document.md"},
        {"Architectural Decisions" = "design-options.md"},
        {"Security" = "security.md"},
    ]},
    {"Architecture" = [
        {"Overview" = "architecture/README.md"},
        {"Runner Model" = "architecture/runner-model.md"},
        {"Permissions" = "architecture/permissions-model.md"},
        {"Secrets & Storage" = "architecture/secrets-model.md"},
    ]},
    {"Onboarding" = [
        {"Invokers" = "invoker-onboarding.md"},
        {"Automata" = "automaton-onboarding.md"},
        {"Joining the Federation" = "federation-contract.md"},
    ]},
    {"Roster" = "roster.md"},
    {"How To" = [
        {"Invoking Automata" = "how-to-invoke.md"},
        {"Org-Wide Setup" = "org-setup.md"},
        {"Webhook Relay (Fly.io)" = "relay-setup.md"},
    ]},
    {"State & Roadmap" = "state.md"},
    {"Contributing" = "contributing.md"},
]

[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.blocks.caption]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[dependency-groups]
dev = [
    "zensical>=0.0.2",
]

[project.theme]
font.text = "Crimson Pro"
font.code = "JetBrains Mono"
palette.scheme = "slate"
palette.primary = "custom"
palette.accent = "custom"
favicon = "./images/favicon.png"
logo="./images/favicon.png"
features = [
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.indexes",
    "navigation.top",
    "toc.follow",
    "search.highlight",
    "search.suggest",
    "content.code.copy",
    "content.code.annotate",
]

[project.theme.icon]
repo = "fontawesome/brands/github"
