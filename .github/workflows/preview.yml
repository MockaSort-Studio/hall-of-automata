name: preview

# Render's free tier allows a single instance, so there is no separate preview
# service: the one service is temporarily repointed at the pull request's git
# branch, then restored to main on close.
#
# The database is shared: previews run against DATABASE_URL_MAIN on the Render
# service (currently Neon; will become the dev RDS when infrastructure splits
# into dev/prod). No per-PR branches are created.
#
# Only one thing moves:
#   - which git branch the service builds
#
# While a preview is up, the deployed app is PR code, and pushes to main do not
# auto-deploy because the service is pointed elsewhere. Closing or merging the
# PR restores main and redeploys it.
#
# Required credentials (Settings → Secrets and variables → Actions):
#   RENDER_API_KEY     — secret. Render account settings. A deploy hook cannot
#                        substitute: hooks only trigger a build, and this workflow
#                        also has to change the service's branch and read deploy
#                        status.
#   RENDER_SERVICE_ID  — secret or variable. The srv-… id in the dashboard URL.
#
# Optional repository variables:
#   RENDER_MAIN_BRANCH (defaults to main)

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # Only PRs that can actually change what the preview serves. Without this,
    # any PR (docs, terraform, an unrelated workflow) repoints the single
    # shared Render service away from whatever livedata PR was using it.
    paths:
      - livedata/**
      - render.yaml
      - .github/workflows/preview.yml
      - .github/scripts/render-api.sh

env:
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID || vars.RENDER_SERVICE_ID }}
  RENDER_MAIN_BRANCH: ${{ vars.RENDER_MAIN_BRANCH || 'main' }}

# There is one service. Deploys and restores must not interleave.
concurrency:
  group: preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy preview
    runs-on: ubuntu-latest
    # Forks cannot read secrets, and their head branch does not exist in this
    # repo for Render to build from.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      # createDeployment, used to record which PR owns the shared service.
      deployments: write

    steps:
      - name: Check required secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${RENDER_API_KEY:-}" ] || missing+=("RENDER_API_KEY")
          [ -n "${RENDER_SERVICE_ID:-}" ] || missing+=("RENDER_SERVICE_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing credentials: ${missing[*]}."
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Repoint service to PR branch
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          source .github/scripts/render-api.sh

          render_api PATCH "/services/$RENDER_SERVICE_ID" \
            "$(jq -n --arg b "$HEAD_REF" '{branch: $b}')" > /dev/null
          echo "Service now builds $HEAD_REF"

          render_api POST "/services/$RENDER_SERVICE_ID/deploys" \
            '{"clearCache": "do_not_clear"}' | jq -r '"Triggered deploy \(.id)"'

      - name: Record which PR owns the service
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.payload.pull_request.head.sha,
              environment: 'render-preview',
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
              description: `PR #${context.issue.number}`,
              payload: { pr: context.issue.number },
            })

      - name: Comment on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- livedata-preview -->'
            const body = [
              marker,
              '### Preview deployed',
              '',
              `The Render service is now building \`${context.payload.pull_request.head.ref}\``,
              `against the shared dev database.`,
              '',
              '- `bin/start` migrates on boot.',
              '- **The single free-tier service is shared, so main is not deployed right now.**',
              '  Merging or closing this PR restores main.',
              '- First request after a quiet period is slow: the service spins down',
              '  after 15 minutes idle.',
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }

  restore:
    name: Restore main
    runs-on: ubuntu-latest
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: read

    steps:
      - name: Check required secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${RENDER_API_KEY:-}" ] || missing+=("RENDER_API_KEY")
          [ -n "${RENDER_SERVICE_ID:-}" ] || missing+=("RENDER_SERVICE_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing credentials: ${missing[*]}."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Does this PR still own the service?
        id: owner
        uses: actions/github-script@v7
        with:
          script: |
            const { data: deployments } = await github.rest.repos.listDeployments({
              ...context.repo,
              environment: 'render-preview',
              per_page: 1,
            })
            const owner = deployments[0]?.payload?.pr
            if (owner == null) {
              core.info('No preview deployment on record — restoring main.')
              core.setOutput('restore', 'true')
              return
            }
            if (String(owner) !== String(context.issue.number)) {
              core.info(`Service is serving PR #${owner}, not #${context.issue.number} — leaving it alone.`)
              core.setOutput('restore', 'false')
              return
            }
            core.setOutput('restore', 'true')

      - name: Restore main
        if: steps.owner.outputs.restore == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          source .github/scripts/render-api.sh

          render_api PATCH "/services/$RENDER_SERVICE_ID" \
            "$(jq -n --arg b "$RENDER_MAIN_BRANCH" '{branch: $b}')" > /dev/null
          echo "Service now builds $RENDER_MAIN_BRANCH"

          render_api POST "/services/$RENDER_SERVICE_ID/deploys" \
            '{"clearCache": "do_not_clear"}' | jq -r '"Triggered deploy \(.id)"'
