name: deploy-livedata

# Deploy pattern:
#   livedata/appspec/script change  → terraform runs (no-op apply), then
#                                     workflow_run fires here; check job sees
#                                     deploy files changed → deploys
#   terraform-only change           → terraform runs (apply), then workflow_run
#                                     fires here; check job sees no deploy files
#                                     → skipped
#   both change in same commit      → terraform runs (apply), then workflow_run
#                                     fires here; check job sees deploy files
#                                     → deploys AFTER infra is settled
#
# Terraform is the sequencer: deploy never starts until terraform has finished,
# for every possible commit combination. No push trigger here.
#
# Builds a Mix release via erlef/setup-beam on Ubuntu 22.04 (Jammy, glibc 2.35)
# — compatible with AL2023 (glibc 2.34) without a Docker container. Bundles into
# a CodeDeploy revision zip, uploads to S3, and triggers a CodeDeploy deployment.
# ValidateService in appspec.yml performs the health check; a failed validate
# triggers automatic rollback.
#
# Authentication: OIDC role assumption — no static AWS keys needed.
#
# Optional repository variables (defaults match Terraform-provisioned names):
#   AWS_REGION             — AWS region (default: eu-north-1)
#   CODEDEPLOY_APP_NAME    — CodeDeploy application name (default: a2t-mrv-livedata)
#   CODEDEPLOY_DG_NAME     — CodeDeploy deployment group name (default: a2t-mrv-livedata-dg)

on:
  # Terraform is the sequencer for all pushes to main. When terraform's apply
  # job completes, the check job below gates on changed deploy-relevant files.
  workflow_run:
    workflows: [terraform]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; never cancel in progress — a partial deploy is worse
# than a queued one.
concurrency:
  group: deploy-livedata
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  check:
    name: Check if deploy is needed
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.gate.outputs.needed }}
    steps:
      - name: Gate on changed files (workflow_run only)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Terraform did not succeed — skipping deploy." >&2
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA="${{ github.event.workflow_run.head_sha }}"
          COUNT=$(gh api "repos/${{ github.repository }}/commits/$SHA" \
            --jq '[.files[].filename] | map(select(
              startswith("livedata/") or
              . == "appspec.yml" or
              startswith("scripts/deploy/") or
              . == ".github/workflows/deploy-livedata.yml"
            )) | length')
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "Deploy-relevant files changed ($COUNT) — deploying." >&2
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No deploy-relevant files in this terraform commit — skipping." >&2
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    name: Build Mix release and deploy via CodeDeploy
    needs: check
    if: needs.check.outputs.needed == 'true'
    environment:
      name: dev
      url: https://dev.mrv.airtotree.com
    # Ubuntu 22.04 (Jammy, glibc 2.35): erlef/setup-beam installs OTP/Elixir
    # linked against the system glibc, so the release runs on AL2023 (glibc 2.34).
    # ubuntu-latest is 24.04 (glibc 2.39) which would require GLIBC_2.38 symbols.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.5"
          otp-version: "27.3"

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            livedata/deps
            livedata/_build/prod/lib
          key: mix-ubuntu-22.04-${{ hashFiles('livedata/mix.lock') }}
          restore-keys: mix-ubuntu-22.04-

      - name: Install dependencies
        working-directory: livedata
        env:
          MIX_ENV: prod
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod

      - name: Compile dependencies
        working-directory: livedata
        env:
          MIX_ENV: prod
        run: mix deps.compile

      - name: Install asset build tools (tailwind + esbuild binaries)
        working-directory: livedata
        env:
          MIX_ENV: prod
        run: mix assets.setup

      - name: Compile application
        # Must run before assets.deploy: assets/js/app.js imports
        # "phoenix-colocated/livedata" written by the compiler into
        # _build/prod/phoenix-colocated/, which esbuild resolves via NODE_PATH.
        working-directory: livedata
        env:
          MIX_ENV: prod
        run: mix compile

      - name: Build and digest assets
        working-directory: livedata
        env:
          MIX_ENV: prod
        run: mix assets.deploy

      - name: Build Mix release
        working-directory: livedata
        env:
          MIX_ENV: prod
        run: mix release livedata

      - name: Smoke-test release boot
        # Run the release eval command in CI with no database credentials.
        # Config.Provider should complete with no patches (no-op path) and the
        # process should exit cleanly. This gate catches module-name errors,
        # config syntax problems, and provider crashes before the release ships.
        working-directory: livedata
        env:
          MIX_ENV: prod
          PHX_HOST: localhost
          SECRET_KEY_BASE: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          COGNITO_USER_POOL_ID: smoke-test-pool
          COGNITO_DOMAIN_PREFIX: smoke-test
          COGNITO_REGION: eu-north-1
        run: |
          set -euo pipefail
          _build/prod/rel/livedata/bin/livedata eval "IO.inspect(:boot_ok)"

      - name: Bundle OpenSSL libs for AL2023 compatibility
        # AL2023 ships OpenSSL 3.5 compiled without SM4 (EVP_sm4_cbc), which the OTP
        # crypto NIF requires. Bundle the Jammy libcrypto/libssl (OpenSSL 3.0, has SM4)
        # with the release; after_install.sh sets LD_LIBRARY_PATH so crypto.so loads
        # the bundled lib instead of the system one.
        run: |
          set -euo pipefail
          OPENSSL_DEST=livedata/_build/prod/rel/livedata/lib/openssl
          mkdir -p "$OPENSSL_DEST"
          cp /usr/lib/x86_64-linux-gnu/libcrypto.so.3 "$OPENSSL_DEST/"
          cp /usr/lib/x86_64-linux-gnu/libssl.so.3 "$OPENSSL_DEST/"
          echo "Bundled: $(ls -sh $OPENSSL_DEST)"

      - name: Package release tarball
        run: |
          set -euo pipefail
          mkdir -p release
          tar -czf release/livedata.tar.gz -C livedata/_build/prod/rel/livedata .
          echo "Release size: $(du -sh release/livedata.tar.gz | cut -f1)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::559744161469:role/a2t-mrv-github-deploy
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      - name: Resolve revisions bucket
        run: |
          set -euo pipefail
          BUCKET=$(aws resourcegroupstaggingapi get-resources \
            --tag-filters Key=Role,Values=codedeploy-revisions Key=Project,Values=a2t-mrv \
            --resource-type-filters s3 \
            --query 'ResourceTagMappingList[0].ResourceARN' \
            --output text | sed 's|arn:aws:s3:::||')
          [ -n "$BUCKET" ] && [ "$BUCKET" != "None" ] || \
            { echo "ERROR: no S3 bucket tagged Role=codedeploy-revisions,Project=a2t-mrv found"; exit 1; }
          echo "REVISION_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Upload release artifact to S3
        run: |
          set -euo pipefail
          aws s3 cp release/livedata.tar.gz \
            "s3://${REVISION_BUCKET}/releases/livedata.tar.gz"

      - name: Bundle revision zip
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zip -r "revision-${COMMIT_SHA}.zip" appspec.yml scripts/deploy/
          echo "Revision zip size: $(du -sh revision-${COMMIT_SHA}.zip | cut -f1)"

      - name: Upload revision to S3
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          aws s3 cp "revision-${COMMIT_SHA}.zip" \
            "s3://${REVISION_BUCKET}/codedeploy-revisions/revision-${COMMIT_SHA}.zip"

      - name: Create CodeDeploy deployment
        env:
          COMMIT_SHA: ${{ github.sha }}
          APP_NAME: ${{ vars.CODEDEPLOY_APP_NAME || 'a2t-mrv-livedata' }}
          DG_NAME: ${{ vars.CODEDEPLOY_DG_NAME || 'a2t-mrv-livedata-dg' }}
        run: |
          set -euo pipefail
          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$APP_NAME" \
            --deployment-group-name "$DG_NAME" \
            --s3-location "bucket=${REVISION_BUCKET},key=codedeploy-revisions/revision-${COMMIT_SHA}.zip,bundleType=zip" \
            --description "Workflow run $GITHUB_RUN_ID — $COMMIT_SHA" \
            --output text --query 'deploymentId')
          echo "Deployment ID: $DEPLOYMENT_ID"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment to complete
        # ValidateService in appspec.yml performs the real health check. A failed
        # validate exits non-zero, which triggers the deployment group's
        # AutoRollbackConfiguration and causes this wait to fail the workflow.
        run: |
          set -euo pipefail
          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"
          echo "Deployment $DEPLOYMENT_ID succeeded."
