name: "[Hall] Invoke Agent"

on:
  workflow_call:
    inputs:
      agent:
        description: Agent identifier (e.g. hamlet)
        required: true
        type: string
      repo-owner:
        description: Target repository owner (defaults to this org)
        required: false
        type: string
        default: ""
      repo-name:
        description: Target repository name (defaults to this repo)
        required: false
        type: string
        default: ""
      issue-number:
        description: Issue or PR number in the target repository
        required: false
        type: string
        default: ""
      failed-run-id:
        description: Run ID of the failed dispatch (post-mortem only)
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      agent:
        description: Agent identifier (e.g. hamlet)
        required: true
        type: string
      repo-owner:
        description: Target repository owner (defaults to this org)
        required: false
        type: string
        default: ""
      repo-name:
        description: Target repository name (defaults to this repo)
        required: false
        type: string
        default: ""
      issue-number:
        description: Issue or PR number in the target repository
        required: false
        type: string
        default: ""
      failed-run-id:
        description: Run ID of the failed dispatch (post-mortem only)
        required: false
        type: string
        default: ""
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  # ── Job 1: resolve invocation context ────────────────────────────────────
  detect:
    name: Detect invocation context
    runs-on: ubuntu-latest
    outputs:
      actor:         ${{ steps.ctx.outputs.actor }}
      agent:         ${{ steps.ctx.outputs.agent }}
      issue-number:  ${{ steps.ctx.outputs.issue-number }}
      invoker:       ${{ steps.ctx.outputs.invoker }}
      invoker-count: ${{ steps.ctx.outputs.invoker-count }}
      trigger-event: ${{ steps.ctx.outputs.trigger-event }}
      repo-owner:    ${{ steps.ctx.outputs.repo-owner }}
      repo-name:     ${{ steps.ctx.outputs.repo-name }}
      pr-number:       ${{ steps.ctx.outputs.pr-number }}
      review-body:     ${{ steps.ctx.outputs.review-body }}
      mode:            ${{ steps.ctx.outputs.mode }}
      trigger-reason:  ${{ steps.ctx.outputs.trigger-reason }}
      onboarding-type: ${{ steps.ctx.outputs.onboarding-type }}
      issue-body:      ${{ steps.ctx.outputs.issue-body }}
      issue-login:     ${{ steps.ctx.outputs.issue-login }}
      awaiting-input:  ${{ steps.ctx.outputs.awaiting-input }}
      comment-body:    ${{ steps.ctx.outputs.comment-body }}
      env-image:       ${{ steps.contract.outputs.env_image }}
    steps:
      - name: Checkout Hall repo (scripts only)
        uses: actions/checkout@v4
        with:
          path: .hall
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: true

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Fetch issue labels (issue_comment)
        id: fetch-labels
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO:     ${{ github.repository }}
        shell: bash
        run: |
          LABELS=$(gh api "repos/$REPO/issues/${{ github.event.issue.number }}" \
            --jq '[.labels[].name]' 2>/dev/null || echo '[]')
          echo "labels-json=$LABELS" >> "$GITHUB_OUTPUT"

      - name: Resolve invocation context
        id: ctx
        env:
          INPUT_AGENT:        ${{ inputs.agent }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue-number }}
          INPUT_REPO_OWNER:   ${{ inputs.repo-owner }}
          INPUT_REPO_NAME:    ${{ inputs.repo-name }}
          ISSUE_LABELS_JSON:  ${{ steps.fetch-labels.outputs.labels-json }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fn = require('./.hall/scripts/detect-invoke-context.js')
            await fn({ github, context, core })

      - name: Read container image from .hall-contract.yaml
        id: contract
        env:
          REPO_OWNER: ${{ steps.ctx.outputs.repo-owner }}
          REPO_NAME:  ${{ steps.ctx.outputs.repo-name }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            let envImage = ''
            try {
              const resp = await github.rest.repos.getContent({
                owner: process.env.REPO_OWNER,
                repo:  process.env.REPO_NAME,
                path:  '.hall-contract.yaml'
              })
              const content = Buffer.from(resp.data.content, 'base64').toString()
              const m = content.match(/^image:\s*(.+)$/m)
              if (m) envImage = m[1].trim()
            } catch (_) {}
            core.setOutput('env_image', envImage)

  # ── Job 2a: route onboard-automaton via workflow_call ────────────────────
  # Fires instead of direct issues:labeled trigger — eliminates triple-queuing.
  route-onboard-automaton:
    name: Route — onboard automaton
    needs: [detect]
    if: needs.detect.outputs.onboarding-type == 'automaton'
    uses: ./.github/workflows/onboard-automaton.yml
    with:
      issue-number: ${{ needs.detect.outputs.issue-number }}
      repo-owner:   ${{ needs.detect.outputs.repo-owner }}
      repo-name:    ${{ needs.detect.outputs.repo-name }}
      issue-login:  ${{ needs.detect.outputs.issue-login }}
      re-evaluate:  ${{ needs.detect.outputs.awaiting-input }}
    secrets: inherit

  # ── Job 2b: route onboard-invoker via workflow_call ───────────────────────
  route-onboard-invoker:
    name: Route — onboard invoker
    needs: [detect]
    if: needs.detect.outputs.onboarding-type == 'invoker'
    uses: ./.github/workflows/onboard-invoker.yml
    with:
      issue-number: ${{ needs.detect.outputs.issue-number }}
      repo-owner:   ${{ needs.detect.outputs.repo-owner }}
      repo-name:    ${{ needs.detect.outputs.repo-name }}
      issue-body:   ${{ needs.detect.outputs.issue-body }}
      issue-login:  ${{ needs.detect.outputs.issue-login }}
      re-evaluate:  ${{ needs.detect.outputs.awaiting-input }}
      comment-body: ${{ needs.detect.outputs.comment-body }}
    secrets: inherit

  # ── Job 3: notify when the invoker pool is exhausted ────────────────────
  # Detect's pool-selection already picked the best invoker (least-used, under
  # cap). This job only runs when the pool is fully exhausted (invoker == '').
  notify-queued:
    name: Notify — pool exhausted
    needs: [detect]
    if: needs.detect.outputs.agent != '' && needs.detect.outputs.invoker == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hall repo (scripts only)
        uses: actions/checkout@v4
        with:
          path: .hall
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: true

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Post queued comment and label
        if: needs.detect.outputs.issue-number != ''
        uses: actions/github-script@v7
        env:
          ACTION:       pool-exhausted
          REPO_OWNER:   ${{ needs.detect.outputs.repo-owner }}
          REPO_NAME:    ${{ needs.detect.outputs.repo-name }}
          ISSUE_NUMBER: ${{ needs.detect.outputs.issue-number }}
          AGENT:        ${{ needs.detect.outputs.agent }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fn = require('./.hall/scripts/notification.js')
            await fn({ github, core })

  # ── Job 4: dispatch the resolved agent ───────────────────────────────────
  # Runs in invoker/<invoker> so secrets.CLAUDE_CODE_OAUTH_TOKEN injects from
  # the pool-selected invoker's environment. Invoker is chosen by detect: the
  # least-used registered member currently under their weekly cap.
  # GHA fails to pull image "" — bare runner requires splitting into two conditional jobs.
  dispatch-bare:
    name: Dispatch ${{ needs.detect.outputs.agent }}
    needs: [detect]
    if: needs.detect.outputs.agent != '' && needs.detect.outputs.invoker != '' && needs.detect.outputs.env-image == ''
    runs-on: ubuntu-latest
    environment: invoker/${{ needs.detect.outputs.invoker }}
    concurrency:
      group: hall-${{ needs.detect.outputs.agent }}-${{ needs.detect.outputs.issue-number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout Hall repo
        uses: actions/checkout@v4
        with:
          path: .hall
      - uses: ./.hall/actions/run-dispatch
        with:
          app-id:          ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          oauth-token:     ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          invoker:         ${{ needs.detect.outputs.invoker }}
          invoker-count:   ${{ needs.detect.outputs.invoker-count }}
          agent:           ${{ needs.detect.outputs.agent }}
          repo-owner:      ${{ needs.detect.outputs.repo-owner }}
          repo-name:       ${{ needs.detect.outputs.repo-name }}
          issue-number:    ${{ needs.detect.outputs.issue-number }}
          trigger-event:   ${{ needs.detect.outputs.trigger-event }}
          pr-number:       ${{ needs.detect.outputs.pr-number }}
          review-body:     ${{ needs.detect.outputs.review-body }}
          mode:            ${{ needs.detect.outputs.mode }}
          actor:           ${{ needs.detect.outputs.actor }}

  # ── Job 4b: dispatch inside target-repo container ─────────────────────────
  # Identical to dispatch-bare except for container.image — GHA fails to pull
  # image "" rather than running bare, so a single conditional job is not viable.
  dispatch-containerized:
    name: Dispatch ${{ needs.detect.outputs.agent }} (containerized)
    needs: [detect]
    if: needs.detect.outputs.agent != '' && needs.detect.outputs.invoker != '' && needs.detect.outputs.env-image != ''
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.detect.outputs.env-image }}
    environment: invoker/${{ needs.detect.outputs.invoker }}
    concurrency:
      group: hall-${{ needs.detect.outputs.agent }}-${{ needs.detect.outputs.issue-number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout Hall repo
        uses: actions/checkout@v4
        with:
          path: .hall
      - uses: ./.hall/actions/run-dispatch
        with:
          app-id:          ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          oauth-token:     ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          invoker:         ${{ needs.detect.outputs.invoker }}
          invoker-count:   ${{ needs.detect.outputs.invoker-count }}
          agent:           ${{ needs.detect.outputs.agent }}
          repo-owner:      ${{ needs.detect.outputs.repo-owner }}
          repo-name:       ${{ needs.detect.outputs.repo-name }}
          issue-number:    ${{ needs.detect.outputs.issue-number }}
          trigger-event:   ${{ needs.detect.outputs.trigger-event }}
          pr-number:       ${{ needs.detect.outputs.pr-number }}
          review-body:     ${{ needs.detect.outputs.review-body }}
          mode:            ${{ needs.detect.outputs.mode }}
          actor:           ${{ needs.detect.outputs.actor }}

#[lore-keeper]: reading the file is overwhealming, each job should be defined in its own action file