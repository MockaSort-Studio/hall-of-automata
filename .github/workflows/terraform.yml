name: terraform

on:
  push:
    branches: [main]
    paths:
      # Terraform source — apply may change infra that deploy depends on.
      - terraform/**
      - .github/workflows/terraform.yml
      # Deploy-relevant files — terraform apply runs first as the sequencer,
      # then workflow_run fires deploy-livedata. This guarantees deploy always
      # happens after infra is settled, regardless of what changed.
      - livedata/**
      - appspec.yml
      - scripts/deploy/**
      - .github/workflows/deploy-livedata.yml
  pull_request:
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_DIR: terraform

jobs:
  changed:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.check.outputs.terraform }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger: always validate and apply.
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            COUNT=$(gh api "repos/${{ github.repository }}/compare/$BASE...$HEAD" \
              --jq '[.files[].filename] | map(select(
                startswith("terraform/") or
                . == ".github/workflows/terraform.yml"
              )) | length')
          else
            COUNT=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" \
              --jq '[.files[].filename] | map(select(
                startswith("terraform/") or
                . == ".github/workflows/terraform.yml"
              )) | length')
          fi
          [ "${COUNT:-0}" -gt 0 ] \
            && echo "terraform=true" >> "$GITHUB_OUTPUT" \
            || echo "terraform=false" >> "$GITHUB_OUTPUT"

  validate:
    name: fmt + validate
    needs: changed
    if: needs.changed.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: terraform fmt
        run: terraform -chdir=$TF_DIR fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform -chdir=$TF_DIR init -backend=false

      - name: terraform validate
        run: terraform -chdir=$TF_DIR validate

      - name: no-managed-services policy check
        # OKR 8 (#146) explicitly adopts AWS managed services: S3 (CRCF lifecycle tiering, #151),
        # RDS/managed-DB resources (#154). KR 6.1 era constraints are retired.
        # All other AWS managed services remain blocked.
        # Grep the module tree; fail loudly if any disallowed type appears.
        run: |
          disallowed_pattern='resource\s+"(aws_lambda_function|aws_ecs_[a-z_]+|aws_dynamodb_[a-z_]+|aws_elasticache_[a-z_]+|aws_mq_[a-z_]+|aws_msk_[a-z_]+|aws_opensearch_[a-z_]+|aws_sqs_[a-z_]+|aws_sns_[a-z_]+|aws_kinesis_[a-z_]+)"'
          matches=$(grep -rEn "$disallowed_pattern" $TF_DIR/modules/ || true)
          if [ -n "$matches" ]; then
            echo "❌ Disallowed AWS managed-service resource types found:"
            echo "$matches"
            exit 1
          fi
          echo "✅ No disallowed managed-service resource types found."

      - name: tflint setup
        uses: terraform-linters/setup-tflint@v4

      - name: tflint init
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --chdir=$TF_DIR --init

      - name: tflint
        run: tflint --chdir=$TF_DIR --recursive

      - name: terraform init (submodule, no backend)
        run: terraform -chdir=$TF_DIR/modules/infra init -backend=false

      - name: terraform test (mock)
        run: terraform -chdir=$TF_DIR/modules/infra test

      - name: terraform init (storage module, no backend)
        run: terraform -chdir=$TF_DIR/modules/storage init -backend=false

      - name: terraform test storage (mock)
        run: terraform -chdir=$TF_DIR/modules/storage test

      - name: terraform init (cognito module, no backend)
        run: terraform -chdir=$TF_DIR/modules/cognito init -backend=false

      - name: terraform test cognito (mock)
        run: terraform -chdir=$TF_DIR/modules/cognito test

  plan:
    name: plan
    needs: [changed, validate]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.changed.outputs.terraform == 'true'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::559744161469:role/a2t-mrv-github-terraform
          aws-region: ${{ vars.TF_AWS_REGION || 'eu-north-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: bootstrap state bucket
        env:
          AWS_DEFAULT_REGION: ${{ vars.TF_AWS_REGION || 'eu-north-1' }}
        run: |
          BUCKET="a2t-mrv-tfstate-559744161469"
          REGION="${AWS_DEFAULT_REGION}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket exists."
          else
            aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
              --create-bucket-configuration LocationConstraint="$REGION"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'
            echo "State bucket created."
          fi

      - name: terraform init
        run: terraform -chdir=$TF_DIR init

      - name: terraform plan
        id: plan
        run: |
          terraform -chdir=$TF_DIR plan \
            -var="key_name=${{ vars.TF_KEY_NAME || 'placeholder' }}" \
            -var="aws_region=${{ vars.TF_AWS_REGION || 'eu-west-1' }}" \
            -var="phx_host=${{ vars.TF_PHX_HOST || 'dev.mrv.airtotree.com' }}" \
            -no-color \
            -out=tfplan 2>&1 | tee plan.txt
          tf_exit="${PIPESTATUS[0]}"
          echo "exitcode=${tf_exit}" >> "$GITHUB_OUTPUT"
          exit "${tf_exit}"

      - name: Post plan to PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.txt', 'utf8').slice(0, 65000);
            const body = `#### Terraform Plan 📖 \`${{ steps.plan.outputs.exitcode }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  apply:
    name: apply
    needs: [changed, validate]
    runs-on: ubuntu-latest
    # always() lets apply run even when validate was skipped (livedata-only push).
    # Guard: validate must have succeeded or been skipped — not failed.
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changed.result == 'success' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::559744161469:role/a2t-mrv-github-terraform
          aws-region: ${{ vars.TF_AWS_REGION || 'eu-north-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      - name: bootstrap state bucket
        env:
          AWS_DEFAULT_REGION: ${{ vars.TF_AWS_REGION || 'eu-north-1' }}
        run: |
          BUCKET="a2t-mrv-tfstate-559744161469"
          REGION="${AWS_DEFAULT_REGION}"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "State bucket exists."
          else
            aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
              --create-bucket-configuration LocationConstraint="$REGION"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration \
              'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'
            echo "State bucket created."
          fi

      - name: terraform init
        run: terraform -chdir=$TF_DIR init

      - name: terraform apply
        run: |
          terraform -chdir=$TF_DIR apply \
            -var="key_name=${{ vars.TF_KEY_NAME || 'placeholder' }}" \
            -var="aws_region=${{ vars.TF_AWS_REGION || 'eu-north-1' }}" \
            -var="phx_host=${{ vars.TF_PHX_HOST || 'dev.mrv.airtotree.com' }}" \
            -auto-approve
