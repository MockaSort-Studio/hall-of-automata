name: Onboard Invoker

# Three-phase flow:
#   Phase 1 — issue labeled hall:onboard-invoker → provision environment, post instructions
#   Phase 2a — invoker replies "ready"           → parse + confirm secret slot exists
#   Phase 2b — test-token job                    → real Claude invocation in invoker env
#   Phase 2c — finalize job                      → welcome on success, retry prompt on failure

concurrency:
  group: onboard-invoker-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  # ── Phase 1: provision environment ───────────────────────────────────────────
  setup:
    name: Provision invoker environment
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'hall:onboard-invoker'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4
        with:
          path: .hall
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: true

      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Parse issue fields
        id: fields
        uses: actions/github-script@v7
        env:
          ISSUE_BODY:  ${{ github.event.issue.body }}
          ISSUE_LOGIN: ${{ github.event.issue.user.login }}
        with:
          script: |
            const fn = require('./.hall/scripts/parse-issue-fields.js')
            await fn({ core })

      - name: Create invoker environment and post instructions
        uses: actions/github-script@v7
        env:
          REPO_OWNER:       ${{ github.repository_owner }}
          REPO_NAME:        ${{ github.event.repository.name }}
          INVOKER_USERNAME: ${{ steps.fields.outputs.invoker-username }}
          WEEKLY_CAP_HOURS: ${{ steps.fields.outputs.weekly-cap-hours }}
          ISSUE_NUMBER:     ${{ github.event.issue.number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fn = require('./.hall/scripts/create-invoker-env.js')
            await fn({ github, core })

  # ── Phase 2a: parse "ready" reply, confirm secret slot exists ────────────────
  parse-ready:
    name: Parse ready signal
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.sender.type != 'Bot' &&
      contains(github.event.issue.labels.*.name, 'hall:onboard-invoker')
    runs-on: ubuntu-latest
    outputs:
      is-ready:         ${{ steps.signal.outputs.is-ready }}
      invoker-username: ${{ steps.fields.outputs.invoker-username }}
      secret-found:     ${{ steps.check.outputs.secret-found }}
    steps:
      - name: Check for ready signal
        id: signal
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body.trim().toLowerCase()
            core.setOutput('is-ready', body.startsWith('ready') ? 'true' : 'false')

      - name: Checkout (scripts only)
        if: steps.signal.outputs.is-ready == 'true'
        uses: actions/checkout@v4
        with:
          path: .hall
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: true

      - name: Create App token
        if: steps.signal.outputs.is-ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Parse invoker username from issue body
        if: steps.signal.outputs.is-ready == 'true'
        id: fields
        uses: actions/github-script@v7
        env:
          ISSUE_BODY:  ${{ github.event.issue.body }}
          ISSUE_LOGIN: ${{ github.event.issue.user.login }}
        with:
          script: |
            const fn = require('./.hall/scripts/parse-issue-fields.js')
            await fn({ core })

      - name: Check secret slot exists
        if: steps.signal.outputs.is-ready == 'true'
        id: check
        uses: actions/github-script@v7
        env:
          REPO_OWNER:       ${{ github.repository_owner }}
          REPO_NAME:        ${{ github.event.repository.name }}
          INVOKER_USERNAME: ${{ steps.fields.outputs.invoker-username }}
          ISSUE_NUMBER:     ${{ github.event.issue.number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fn = require('./.hall/scripts/verify-invoker-setup.js')
            await fn({ github, core })

  # ── Phase 2b: real Claude test invocation using the invoker's token ───────────
  test-token:
    name: Test invoker token (live invocation)
    needs: [parse-ready]
    if: >-
      needs.parse-ready.outputs.is-ready == 'true' &&
      needs.parse-ready.outputs.secret-found == 'true'
    runs-on: ubuntu-latest
    environment: invoker/${{ needs.parse-ready.outputs.invoker-username }}
    steps:
      - name: Mask token
        shell: bash
        run: echo "::add-mask::${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}"

      - name: Checkout Hall repo
        uses: actions/checkout@v4
        with:
          path: .hall
          sparse-checkout: actions/
          sparse-checkout-cone-mode: true

      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run minimal token validation
        id: test
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token:            ${{ steps.app-token.outputs.token }}
          claude_args:             "--max-turns 1"
          prompt: >-
            This is a token validation test. Do not read or modify any files.
            Reply with exactly the word VALID and nothing else.

      - name: Record test result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.test.outcome }}" == "success" ]]; then
            echo "test-passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "test-passed=false" >> "$GITHUB_OUTPUT"
          fi
        id: result

    outputs:
      test-passed: ${{ steps.result.outputs.test-passed }}

  # ── Phase 2c: post result ─────────────────────────────────────────────────────
  finalize:
    name: Post onboarding result
    needs: [parse-ready, test-token]
    if: always() && needs.parse-ready.outputs.is-ready == 'true' && needs.parse-ready.outputs.secret-found == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4
        with:
          path: .hall
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: true

      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Post welcome or failure comment
        uses: actions/github-script@v7
        env:
          REPO_OWNER:       ${{ github.repository_owner }}
          REPO_NAME:        ${{ github.event.repository.name }}
          ISSUE_NUMBER:     ${{ github.event.issue.number }}
          INVOKER_USERNAME: ${{ needs.parse-ready.outputs.invoker-username }}
          TEST_PASSED:      ${{ needs.test-token.outputs.test-passed }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fn = require('./.hall/scripts/finalize-invoker-onboarding.js')
            await fn({ github, core })

