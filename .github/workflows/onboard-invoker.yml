name: Onboard Invoker

# Three-phase flow:
#   Phase 1 — issue labeled hall:onboard-invoker → provision environment, post instructions
#   Phase 2a — invoker replies "ready"           → parse + confirm secret slot exists
#   Phase 2b — test-token job                    → real Claude invocation in invoker env
#   Phase 2c — finalize job                      → welcome on success, retry prompt on failure

concurrency:
  group: onboard-invoker-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  # ── Phase 1: provision environment ───────────────────────────────────────────
  setup:
    name: Provision invoker environment
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'hall:onboard-invoker'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4
        with:
          path: .hall
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: true

      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Parse issue fields
        id: fields
        uses: actions/github-script@v7
        env:
          ISSUE_BODY:  ${{ github.event.issue.body }}
          ISSUE_LOGIN: ${{ github.event.issue.user.login }}
        with:
          script: |
            const fn = require('./.hall/scripts/parse-issue-fields.js')
            await fn({ core })

      - name: Create invoker environment and post instructions
        uses: actions/github-script@v7
        env:
          REPO_OWNER:       ${{ github.repository_owner }}
          REPO_NAME:        ${{ github.event.repository.name }}
          INVOKER_USERNAME: ${{ steps.fields.outputs.invoker-username }}
          WEEKLY_CAP_HOURS: ${{ steps.fields.outputs.weekly-cap-hours }}
          ISSUE_NUMBER:     ${{ github.event.issue.number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fn = require('./.hall/scripts/create-invoker-env.js')
            await fn({ github, core })

  # ── Phase 2a: parse "ready" reply, confirm secret slot exists ────────────────
  parse-ready:
    name: Parse ready signal
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.sender.type != 'Bot' &&
      contains(github.event.issue.labels.*.name, 'hall:onboard-invoker')
    runs-on: ubuntu-latest
    outputs:
      is-ready:         ${{ steps.signal.outputs.is-ready }}
      invoker-username: ${{ steps.fields.outputs.invoker-username }}
      secret-found:     ${{ steps.check.outputs.secret-found }}
    steps:
      - name: Check for ready signal
        id: signal
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body.trim().toLowerCase()
            core.setOutput('is-ready', body.startsWith('ready') ? 'true' : 'false')

      - name: Checkout (scripts only)
        if: steps.signal.outputs.is-ready == 'true'
        uses: actions/checkout@v4
        with:
          path: .hall
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: true

      - name: Create App token
        if: steps.signal.outputs.is-ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Parse invoker username from issue body
        if: steps.signal.outputs.is-ready == 'true'
        id: fields
        uses: actions/github-script@v7
        env:
          ISSUE_BODY:  ${{ github.event.issue.body }}
          ISSUE_LOGIN: ${{ github.event.issue.user.login }}
        with:
          script: |
            const fn = require('./.hall/scripts/parse-issue-fields.js')
            await fn({ core })

      - name: Check secret slot exists
        if: steps.signal.outputs.is-ready == 'true'
        id: check
        uses: actions/github-script@v7
        env:
          REPO_OWNER:       ${{ github.repository_owner }}
          REPO_NAME:        ${{ github.event.repository.name }}
          INVOKER_USERNAME: ${{ steps.fields.outputs.invoker-username }}
          ISSUE_NUMBER:     ${{ github.event.issue.number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fn = require('./.hall/scripts/verify-invoker-setup.js')
            await fn({ github, core })

  # ── Phase 2b: validate the invoker's OAuth token ─────────────────────────────
  # Primary: run actual dispatch action — confirms the full pipeline end-to-end.
  # Fallback: if dispatch fails, probe the API directly to distinguish quota-
  # exceeded (429 → pass) from bad token (401/403 → fail).
  test-token:
    name: Validate invoker token
    needs: [parse-ready]
    if: >-
      needs.parse-ready.outputs.is-ready == 'true' &&
      needs.parse-ready.outputs.secret-found == 'true'
    runs-on: ubuntu-latest
    environment: invoker/${{ needs.parse-ready.outputs.invoker-username }}
    outputs:
      test-passed: ${{ steps.result.outputs.test-passed }}
    steps:
      - name: Checkout Hall repo (dispatch action)
        uses: actions/checkout@v4

      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Write validation CLAUDE.md
        run: |
          cat > CLAUDE.md << 'EOF'
          # Hall Token Validation
          This is a single-turn token validation check. Reply to the prompt with exactly the word requested. Do not use any tools. Do not read any files. Do not explore the repository.
          EOF

      - name: Validate token via dispatch
        id: dispatch
        continue-on-error: true
        uses: ./actions/dispatch
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          app-token:   ${{ steps.app-token.outputs.token }}
          max-turns:   1
          prompt:      "Reply with exactly one word: ready"

      - name: Fallback probe (dispatch failed — check if quota-exceeded vs bad token)
        id: fallback
        if: steps.dispatch.outcome == 'failure'
        shell: bash
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "::add-mask::$TOKEN"
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            -X POST "https://api.anthropic.com/v1/messages" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d '{"model":"claude-haiku-4-5","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}') || HTTP=000
          echo "fallback HTTP: $HTTP"
          # 429 = valid token, quota exhausted — treat as pass
          # 401/403 = bad token — fail
          # 000 = network unreachable — inconclusive, treat as fail (cannot confirm token)
          if [[ "$HTTP" == "429" ]]; then
            echo "passed=true"  >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve result
        id: result
        shell: bash
        run: |
          if [[ "${{ steps.dispatch.outcome }}" == "success" ]]; then
            echo "test-passed=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.fallback.outputs.passed }}" == "true" ]]; then
            echo "test-passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "test-passed=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Phase 2c: post result ─────────────────────────────────────────────────────
  finalize:
    name: Post onboarding result
    needs: [parse-ready, test-token]
    if: always() && needs.parse-ready.outputs.is-ready == 'true' && needs.parse-ready.outputs.secret-found == 'true' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (scripts only)
        uses: actions/checkout@v4
        with:
          path: .hall
          sparse-checkout: scripts/
          sparse-checkout-cone-mode: true

      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Post welcome or failure comment
        uses: actions/github-script@v7
        env:
          REPO_OWNER:       ${{ github.repository_owner }}
          REPO_NAME:        ${{ github.event.repository.name }}
          ISSUE_NUMBER:     ${{ github.event.issue.number }}
          INVOKER_USERNAME: ${{ needs.parse-ready.outputs.invoker-username }}
          TEST_PASSED:      ${{ needs.test-token.outputs.test-passed }}
          QUOTA_EXCEEDED:   'false'
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fn = require('./.hall/scripts/finalize-invoker-onboarding.js')
            await fn({ github, core })

