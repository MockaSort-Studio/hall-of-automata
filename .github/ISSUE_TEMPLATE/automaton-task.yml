name: "Hamlet — Automaton Task"
description: Invoke Hamlet on a task. Fill this out completely — the agent has no context beyond what is here.
labels: ["hall:hamlet"]
body:
  - type: markdown
    attributes:
      value: |
        Submitting this form invokes **Hamlet**. The `hall:hamlet` label is applied automatically — no extra step needed.
        The Hall will post a status card as its first response.

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: What you need from Hamlet.
      options:
        - "Doing — implement this"
        - "Advising — evaluate options and recommend"
        - "Researching — investigate and report"
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Target repository
      description: "Which repo this task concerns (if different from this one)"
      placeholder: "MockaSort-Studio/ADP8"

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What Hamlet needs to know. Relevant files, current behavior, constraints, prior decisions.
      placeholder: |
        - File: core/lifecycle/task.hpp — base class for all tasks
        - Current behavior: X
        - Constraint: no heap allocation in hot path
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: What done looks like. Be specific.
      placeholder: |
        - [ ] Implement X following Y pattern
        - [ ] Unit test covering Z edge case
        - [ ] BUILD file updated
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What Hamlet should NOT do or touch. Optional but useful.
      placeholder: |
        - Do not modify the public API
        - Do not add dependencies

  - type: checkboxes
    id: sign-off-required
    attributes:
      label: Sign-off required before action
      options:
        - label: "This task requires human review before any code is pushed"
