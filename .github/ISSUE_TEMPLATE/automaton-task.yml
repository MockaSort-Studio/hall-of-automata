name: "Automaton Task"
description: Invoke an automaton on a task. Fill this out completely — the agent has no context beyond what is here.
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Submitting this form creates a task issue. Assign it to `@hall-of-automata` or apply `hall:<agent>` to invoke directly.
        The Hall will post a status card as its first response.

  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: Which automaton should handle this task. Leave blank to let Old Major decide.
      options:
        - "(let Old Major decide)"
        - "hamlet"
      default: 0
    validations:
      required: false

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: What you need from the agent.
      options:
        - "Doing — implement this"
        - "Advising — evaluate options and recommend"
        - "Researching — investigate and report"
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Target repository
      description: "Which repo this task concerns (if different from this one)"
      placeholder: "MockaSort-Studio/ADP8"

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What the agent needs to know. Relevant files, current behavior, constraints, prior decisions.
      placeholder: |
        - File: core/lifecycle/task.hpp — base class for all tasks
        - Current behavior: X
        - Constraint: no heap allocation in hot path
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: What done looks like. Be specific.
      placeholder: |
        - [ ] Implement X following Y pattern
        - [ ] Unit test covering Z edge case
        - [ ] BUILD file updated
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What the agent should NOT do or touch. Optional but useful.
      placeholder: |
        - Do not modify the public API
        - Do not add dependencies

  - type: checkboxes
    id: sign-off-required
    attributes:
      label: Sign-off required before action
      options:
        - label: "This task requires human review before any code is pushed"

