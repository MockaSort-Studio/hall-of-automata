version: 0.0
os: linux
hooks:
  ApplicationStop:
    - location: scripts/deploy/stop.sh
      timeout: 60
      runas: root
  BeforeInstall:
    - location: scripts/deploy/before_install.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/deploy/after_install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/deploy/start.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/deploy/validate.sh
      timeout: 120
      runas: root
