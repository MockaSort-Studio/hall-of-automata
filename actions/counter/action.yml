name: Invocation Counter
description: >
  Increments HALL_USAGE_COUNT in the agent's GitHub Environment via the REST API.
  The current count is read from vars.HALL_USAGE_COUNT in the calling job (injected
  automatically because the job runs in environment: hall/<agent>) and passed as an
  input. No cache, no JSON blobs — one PATCH call on increment.

inputs:
  current-count:
    description: Current value read from vars.HALL_USAGE_COUNT in the calling job
    required: true
  environment-name:
    description: Full GitHub Environment name (e.g. hall/hamlet)
    required: true
  repo-owner:
    description: Repository owner
    required: true
  repo-name:
    description: Repository name
    required: true
  app-token:
    description: GitHub App installation token (environments:write required)
    required: true

outputs:
  count:
    description: New invocation count after increment
    value: ${{ steps.increment.outputs.count }}

runs:
  using: composite
  steps:
    - name: Increment and persist
      id: increment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.app-token }}
      run: |
        NEXT=$(( ${{ inputs.current-count }} + 1 ))
        # URL-encode the environment name (hall/hamlet → hall%2Fhamlet)
        ENV_ENCODED="${{ inputs.environment-name }}"
        ENV_ENCODED="${ENV_ENCODED//\//%2F}"
        gh api --method PATCH \
          /repos/${{ inputs.repo-owner }}/${{ inputs.repo-name }}/environments/${ENV_ENCODED}/variables/HALL_USAGE_COUNT \
          -f name=HALL_USAGE_COUNT \
          -f value="${NEXT}"
        echo "count=${NEXT}" >> "$GITHUB_OUTPUT"
