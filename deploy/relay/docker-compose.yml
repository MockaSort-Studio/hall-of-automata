services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      - WEBHOOK_SECRET
      - APP_ID
      - APP_PRIVATE_KEY
      - HALL_OPERATOR
      - HALL_REPO
      - HALL_REF
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - RELAY_DOMAIN
      - RELAY_ADMIN_EMAIL
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
